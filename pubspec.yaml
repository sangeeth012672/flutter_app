name: smart_task_manager
description: "Smart Task Manager - Clean Architecture Flutter App with Firebase & REST API"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0

  # State Management
  flutter_riverpod: ^2.5.1

  # HTTP Client
  dio: ^5.7.0

  # Local Storage (Offline-First)
  hive_flutter: ^1.1.0

  # Connectivity
  connectivity_plus: ^6.0.3

  # Navigation
  go_router: ^14.3.0

  # UI Enhancements
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0

  # Utils
  intl: ^0.19.0
  shared_preferences: ^2.3.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
